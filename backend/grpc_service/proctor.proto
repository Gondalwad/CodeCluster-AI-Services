syntax = "proto3";

package proctor;

option java_package = "com.codecluster.proctor.grpc";
option java_outer_classname = "ProctorProto";

service ProctoringService {
  rpc RegisterCandidate (RegisterRequest)  returns (RegisterResponse);
  rpc StartSession      (SessionRequest)   returns (SessionResponse);
  rpc AnalyzeFrame      (FrameRequest)     returns (FrameResponse);
  rpc EndSession        (SessionRequest)   returns (SessionResponse);
}

message RegisterRequest {
  string candidate_id = 1;
  bytes  face_image   = 2;
}

message RegisterResponse {
  bool   success = 1;
  string message = 2;
}

message SessionRequest {
  string candidate_id = 1;
}

message SessionResponse {
  bool   success = 1;
  string message = 2;
}

message FrameRequest {
  string candidate_id = 1;
  bytes  frame_jpeg   = 2;
  int64  timestamp    = 3;
  bytes  audio_chunk  = 4;   // raw PCM (16kHz mono int16), optional
}

message FrameResponse {
  int64          timestamp              = 1;
  string         candidate_id           = 2;
  VisionAnalysis vision_analysis        = 3;
  AudioAnalysis  audio_analysis         = 4;
  repeated string violations            = 5;
  repeated string continuous_violations = 6;
  repeated string snapshot_violations   = 7;
  string         system_status          = 8;
  string         error_message          = 9;
}

message VisionAnalysis {
  string  gaze_direction   = 1;
  bool    is_head_turned   = 2;
  float   yaw_angle        = 3;
  float   pitch_angle      = 4;
  int32   face_count       = 5;
  string  face_status      = 6;
  bool    face_matched     = 7;
  float   similarity_score = 8;
  bool    eyes_closed      = 9;
  int32   blink_count      = 10;
  bool    specs_detected   = 11;
  float   specs_confidence = 12;
  repeated DetectedObject detected_objects = 13;
}

message AudioAnalysis {
  bool  is_human_speech    = 1;
  float speech_probability = 2;
}

message DetectedObject {
  string         label      = 1;
  float          confidence = 2;
  repeated int32 bbox       = 3;
}
